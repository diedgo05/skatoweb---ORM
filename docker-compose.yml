services:
  db:
    image: mysql:8.0
    container_name: skato-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"   # 3307 en tu PC -> 3306 del contenedor (evita chocar con un MySQL local)
    volumes:
      - skato-db-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro   # crea esquema + datos semilla la 1ª vez
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    container_name: skato-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # la API arranca SOLO cuando MySQL ya está listo
    environment:
      DB_HOST: db          # nombre del servicio = hostname dentro de la red de Docker
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DIALECT: mysql
    ports:
      - "3000:3000"

volumes:
  skato-db-data: